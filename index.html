<title>Rose Window</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: one screen, no scroll. Name and tallies on top, the window (canvas) fills the middle, controls below. */
  :root {
    color-scheme: dark;
    --stone: #1a1c29;
    --stone-raised: #272b3d;
    --lead: #0d0e15;
    --text: #ece6d8;
    --muted: #a5a1b2;
    --amber: #e8a82e;
    --ruby: #c7334b;
    --font-display: "Grenze Gotisch", "Palatino Linotype", Palatino, Georgia, serif;
    --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--stone);
    color: var(--text);
    font: 16px/1.4 var(--font-body);
    overflow: hidden;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 20px;
    width: 100%;
    max-width: 560px;
    margin-inline: auto;
  }
  h1 {
    margin: 0;
    font: 700 30px/1 var(--font-display);
    letter-spacing: 0.01em;
    color: var(--amber);
  }
  .tallies { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; }
  .tallies div { display: flex; align-items: baseline; gap: 6px; }
  .tallies dt {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
  }
  .tallies dd {
    margin: 0;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
  }
  #lives { color: var(--ruby); letter-spacing: 0.12em; min-width: 3.4em; }

  #stage {
    flex: 1;
    min-height: 240px;
    display: grid;
    place-items: center;
  }
  .frame {
    position: relative;
    line-height: 0;
    border: 3px solid var(--lead);
    border-radius: 26px 26px 6px 6px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--stone-raised), 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  canvas { display: block; touch-action: none; cursor: none; }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 20px 20px 22%;
    text-align: center;
    line-height: 1.4;
    background: linear-gradient(to bottom, rgba(13, 14, 21, 0) 30%, rgba(13, 14, 21, 0.88) 62%);
  }
  #overlay h2 {
    margin: 0;
    font: 700 34px/1.05 var(--font-display);
    text-wrap: balance;
  }
  #overlay p { margin: 0; max-width: 30ch; color: var(--muted); text-wrap: balance; }

  button {
    font: 500 15px/1 var(--font-body);
    color: var(--text);
    background: var(--stone-raised);
    border: 1px solid rgba(236, 230, 216, 0.16);
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: rgba(236, 230, 216, 0.4); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    margin-top: 4px;
    font-weight: 700;
    font-size: 17px;
    padding: 12px 26px;
    color: var(--lead);
    background: var(--amber);
    border-color: transparent;
  }
  button.primary:hover { filter: brightness(1.08); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    width: 100%;
    max-width: 560px;
    margin-inline: auto;
  }
  footer p { margin: 0; min-width: 0; flex: 1 1 220px; font-size: 14px; color: var(--muted); }
  footer b { color: var(--text); font-weight: 700; }
  .buttons { display: flex; gap: 8px; }
</style>

<header>
  <h1>Rose Window</h1>
  <dl class="tallies">
    <div><dt>Score</dt><dd id="score">0</dd></div>
    <div><dt>Best</dt><dd id="best">0</dd></div>
    <div><dt>Window</dt><dd id="level">1</dd></div>
    <div><dt>Pebbles</dt><dd id="lives" aria-label="3 pebbles left">●●●</dd></div>
  </dl>
</header>

<div id="stage">
  <div class="frame">
    <canvas id="game" width="480" height="640" aria-label="Game board"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">Break every pane</h2>
      <p id="overlayText">Bounce the pebble off your paddle and knock out the glass. Leaded panes take two hits.</p>
      <button id="overlayBtn" class="primary">Play</button>
    </div>
  </div>
</div>

<footer>
  <p><b>Move</b> mouse, finger or ← → · <b>Launch</b> click or Space · Catch <b>W</b> wide paddle, <b>M</b> more pebbles, <b>+</b> extra pebble</p>
  <div class="buttons">
    <button id="pauseBtn" disabled>Pause</button>
    <button id="soundBtn" aria-pressed="true">Sound on</button>
  </div>
</footer>

<script>
(() => {
  const W = 480, H = 640;
  const COLS = 10, ROWS = 9, MARGIN = 20, GAP = 4, BH = 20, TOP = 64;
  const BW = (W - 2 * MARGIN - GAP * (COLS - 1)) / COLS;
  const PADDLE_Y = H - 44, PADDLE_H = 12, PADDLE_W = 84, BALL_R = 6, MAX_BALLS = 9;
  const JEWELS = ['#b8283f', '#2a5cc4', '#1f9463', '#e3a52b', '#8544b5', '#27a3b5'];
  const LEAD = '#0d0e15';

  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d'), stage = $('stage');
  const overlay = $('overlay'), overlayTitle = $('overlayTitle'), overlayText = $('overlayText'), overlayBtn = $('overlayBtn');
  const pauseBtn = $('pauseBtn'), soundBtn = $('soundBtn');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Each layout returns null for a gap, or { hp, color } for a pane.
  const LAYOUTS = [
    // Lancet arch
    (r, c) => {
      const x = Math.abs((c + 0.5) / COLS * 2 - 1);
      if (x > 0.2 + 0.8 * Math.sqrt((r + 1) / ROWS)) return null;
      return { hp: 1, color: (Math.floor(Math.abs(c - 4.5)) + r) % 6 };
    },
    // Rose
    (r, c) => {
      const d = Math.hypot((c - 4.5) / 5, (r - 4) / 4.6);
      if (d > 1.02) return null;
      return { hp: d > 0.5 && d < 0.72 ? 2 : 1, color: [3, 0, 1, 4, 5][Math.min(4, Math.floor(d * 4))] };
    },
    // Diamond quarries
    (r, c) => ({ hp: (r + c) % 3 === 0 ? 2 : 1, color: (r + c) % 6 }),
  ];

  let state = 'title'; // title | play | paused | clear | over
  let score = 0, best = 0, lives = 3, level = 1;
  let bricks = [], remaining = 0, balls = [], drops = [], shards = [];
  let wideTimer = 0;
  const paddle = { x: W / 2, w: PADDLE_W };
  const keys = new Set();
  let scale = 1, dpr = 1, last = 0, hudText = '';
  let primary = () => {};

  try { best = +localStorage.getItem('rose-window-best') || 0; } catch {}

  // --- sound ---
  let ac = null, muted = false;
  try { muted = localStorage.getItem('rose-window-muted') === '1'; } catch {}
  function tone(freq, dur = 0.07, type = 'sine', vol = 0.05) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
    } catch {}
  }
  function syncSound() {
    soundBtn.textContent = muted ? 'Sound off' : 'Sound on';
    soundBtn.setAttribute('aria-pressed', String(!muted));
  }

  // --- setup ---
  function buildLevel() {
    const layout = LAYOUTS[(level - 1) % LAYOUTS.length];
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = layout(r, c);
        if (!cell) continue;
        bricks.push({
          x: MARGIN + c * (BW + GAP), y: TOP + r * (BH + GAP), w: BW, h: BH,
          hp: cell.hp, max: cell.hp, color: JEWELS[cell.color], alive: true,
        });
      }
    }
    remaining = bricks.length;
    drops = [];
    shards = [];
  }

  function ballSpeed() { return Math.min(520, 320 + 25 * (level - 1)); }

  function resetBall() {
    balls = [{ x: paddle.x, y: PADDLE_Y - BALL_R, vx: 0, vy: 0, stuck: true }];
    wideTimer = 0;
    paddle.w = PADDLE_W;
  }

  function newGame() {
    score = 0; lives = 3; level = 1;
    paddle.x = W / 2;
    buildLevel();
    resetBall();
  }

  function launch() {
    const sp = ballSpeed();
    for (const b of balls) {
      if (!b.stuck) continue;
      const a = (Math.random() - 0.5) * 0.6;
      b.vx = sp * Math.sin(a);
      b.vy = -sp * Math.cos(a);
      b.stuck = false;
    }
  }

  // --- overlay and state ---
  function show(title, text, label, action) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = label;
    primary = action;
    overlay.hidden = false;
  }
  function play() {
    state = 'play';
    overlay.hidden = true;
    pauseBtn.disabled = false;
    pauseBtn.textContent = 'Pause';
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    pauseBtn.textContent = 'Resume';
    show('Paused', 'Your pebble is waiting.', 'Resume', play);
  }
  function gameOver() {
    state = 'over';
    pauseBtn.disabled = true;
    const record = score > best;
    if (record) {
      best = score;
      try { localStorage.setItem('rose-window-best', String(best)); } catch {}
    }
    tone(180, 0.4, 'triangle', 0.07);
    show('Out of pebbles', record ? `New best: ${score} points.` : `You scored ${score} points.`, 'Play again', () => { newGame(); play(); });
  }
  function levelClear() {
    state = 'clear';
    pauseBtn.disabled = true;
    const bonus = 100 * lives;
    score += bonus;
    [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'sine', 0.06), i * 110));
    show('Window cleared', `Bonus ${bonus} for the pebbles you kept. The next one is faster.`, 'Next window', () => {
      level++;
      buildLevel();
      resetBall();
      play();
    });
  }

  // --- simulation ---
  function hitBrick(b, ball) {
    b.hp--;
    if (b.hp > 0) {
      score += 10;
      tone(520, 0.05, 'triangle');
      return;
    }
    b.alive = false;
    remaining--;
    score += b.max > 1 ? 25 : 10;
    tone(900 + Math.random() * 700, 0.09);
    const n = reduceMotion ? 0 : 7;
    for (let i = 0; i < n; i++) {
      shards.push({
        x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h,
        vx: (Math.random() - 0.5) * 220 + ball.vx * 0.15, vy: (Math.random() - 0.7) * 200,
        rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 12,
        size: 3 + Math.random() * 5, life: 0.7, color: b.color,
      });
    }
    if (Math.random() < 0.13) {
      const roll = Math.random();
      drops.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, kind: roll < 0.45 ? 'W' : roll < 0.88 ? 'M' : '+' });
    }
  }

  function applyDrop(kind) {
    tone(700, 0.12, 'square', 0.03);
    score += 15;
    if (kind === 'W') {
      paddle.w = PADDLE_W * 1.5;
      wideTimer = 12;
    } else if (kind === '+') {
      lives = Math.min(5, lives + 1);
    } else {
      const extra = [];
      for (const b of balls) {
        if (b.stuck) continue;
        for (const turn of [-0.4, 0.4]) {
          if (balls.length + extra.length >= MAX_BALLS) break;
          const cos = Math.cos(turn), sin = Math.sin(turn);
          extra.push({ x: b.x, y: b.y, vx: b.vx * cos - b.vy * sin, vy: b.vx * sin + b.vy * cos, stuck: false });
        }
      }
      balls.push(...extra);
    }
  }

  function stepBall(ball, dt) {
    const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 4));
    const h = dt / steps;
    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx * h;
      ball.y += ball.vy * h;

      if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
      else if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

      if (ball.vy > 0 && ball.y + BALL_R >= PADDLE_Y && ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
          Math.abs(ball.x - paddle.x) <= paddle.w / 2 + BALL_R) {
        const off = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
        const sp = Math.hypot(ball.vx, ball.vy), a = off * 1.05;
        ball.vx = sp * Math.sin(a);
        ball.vy = -sp * Math.cos(a);
        ball.y = PADDLE_Y - BALL_R;
        tone(300, 0.05, 'triangle');
      }

      for (const b of bricks) {
        if (!b.alive) continue;
        const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
        const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        const dx = ball.x - nx, dy = ball.y - ny;
        if (dx * dx + dy * dy >= BALL_R * BALL_R) continue;
        if (Math.abs(dx) > Math.abs(dy)) {
          ball.vx = Math.abs(ball.vx) * Math.sign(dx);
          ball.x = nx + Math.sign(dx) * BALL_R;
        } else {
          const dir = dy !== 0 ? Math.sign(dy) : -Math.sign(ball.vy) || 1;
          ball.vy = Math.abs(ball.vy) * dir;
          ball.y = (dir > 0 ? b.y + b.h : b.y) + dir * BALL_R;
        }
        hitBrick(b, ball);
        break;
      }
      if (ball.y - BALL_R > H) return false;
    }
    return true;
  }

  function update(dt) {
    const dir = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
    paddle.x += dir * 520 * dt;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

    if (wideTimer > 0 && (wideTimer -= dt) <= 0) paddle.w = PADDLE_W;

    balls = balls.filter(b => {
      if (b.stuck) { b.x = paddle.x; b.y = PADDLE_Y - BALL_R; return true; }
      return stepBall(b, dt);
    });

    drops = drops.filter(d => {
      d.y += 130 * dt;
      if (d.y + 10 >= PADDLE_Y && d.y - 10 <= PADDLE_Y + PADDLE_H && Math.abs(d.x - paddle.x) <= paddle.w / 2 + 10) {
        applyDrop(d.kind);
        return false;
      }
      return d.y < H + 12;
    });

    if (remaining === 0) { levelClear(); return; }

    if (balls.length === 0) {
      lives--;
      if (lives <= 0) { gameOver(); return; }
      tone(220, 0.25, 'triangle', 0.06);
      drops = [];
      resetBall();
    }
  }

  function updateShards(dt) {
    shards = shards.filter(s => {
      s.vy += 700 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.spin * dt;
      return (s.life -= dt) > 0;
    });
  }

  // --- drawing ---
  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#232742');
    sky.addColorStop(1, '#12131d');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(W / 2, TOP + 110, 20, W / 2, TOP + 110, 300);
    glow.addColorStop(0, 'rgba(232, 168, 46, 0.16)');
    glow.addColorStop(1, 'rgba(232, 168, 46, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = LEAD;
      ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(b.x, b.y, b.w, 3);
      ctx.fillRect(b.x, b.y, 3, b.h);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(b.x, b.y + b.h - 3, b.w, 3);
      if (b.max > 1) {
        ctx.beginPath();
        if (b.hp > 1) {
          ctx.strokeStyle = LEAD;
          ctx.lineWidth = 2;
          ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + b.w, b.y + b.h);
          ctx.moveTo(b.x + b.w, b.y); ctx.lineTo(b.x, b.y + b.h);
        } else {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.lineWidth = 1;
          ctx.moveTo(b.x + b.w * 0.2, b.y);
          ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.55);
          ctx.lineTo(b.x + b.w * 0.35, b.y + b.h);
          ctx.moveTo(b.x + b.w * 0.45, b.y + b.h * 0.55);
          ctx.lineTo(b.x + b.w * 0.85, b.y + b.h * 0.3);
        }
        ctx.stroke();
      }
    }

    for (const s of shards) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = Math.min(1, s.life * 2.5);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.moveTo(-s.size / 2, -s.size / 2);
      ctx.lineTo(s.size / 2, -s.size / 4);
      ctx.lineTo(0, s.size / 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.font = '700 13px "Alegreya Sans", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const d of drops) {
      ctx.fillStyle = '#e8a82e';
      ctx.beginPath();
      ctx.arc(d.x, d.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = LEAD;
      ctx.fillText(d.kind, d.x, d.y + 1);
    }

    ctx.fillStyle = wideTimer > 0 ? '#e8a82e' : '#d9d2c0';
    ctx.beginPath();
    ctx.roundRect(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, PADDLE_H, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.fillRect(paddle.x - paddle.w / 2 + 6, PADDLE_Y + PADDLE_H - 4, paddle.w - 12, 2);

    for (const b of balls) {
      ctx.fillStyle = 'rgba(244, 239, 226, 0.18)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R + 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f4efe2';
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }

    if (state === 'play' && balls.some(b => b.stuck)) {
      ctx.fillStyle = '#a5a1b2';
      ctx.font = '500 16px "Alegreya Sans", system-ui, sans-serif';
      ctx.fillText('Click or press Space to launch', W / 2, PADDLE_Y - 70);
    }
  }

  function hud() {
    const text = `${score}|${best}|${level}|${lives}`;
    if (text === hudText) return;
    hudText = text;
    $('score').textContent = score;
    $('best').textContent = Math.max(best, score);
    $('level').textContent = level;
    $('lives').textContent = '●'.repeat(Math.max(0, lives));
    $('lives').setAttribute('aria-label', `${lives} pebbles left`);
  }

  function frame(t) {
    const dt = Math.min((t - last) / 1000 || 0, 1 / 30);
    last = t;
    if (state === 'play') update(dt);
    if (state !== 'paused') updateShards(dt);
    draw();
    hud();
    requestAnimationFrame(frame);
  }

  function fit() {
    const box = stage.getBoundingClientRect();
    const w = Math.max(180, Math.floor(Math.min(box.width - 6, (box.height - 6) * W / H)));
    const h = Math.floor(w * H / W);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    scale = w / W;
    draw();
  }

  // --- input ---
  function pointerX(e) {
    const rect = cv.getBoundingClientRect();
    return (e.clientX - rect.left) / scale;
  }
  cv.addEventListener('pointermove', e => {
    if (state === 'play') paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, pointerX(e)));
  });
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, pointerX(e)));
    launch();
  });

  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (KEYMAP[e.key]) { keys.add(KEYMAP[e.key]); e.preventDefault(); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      if (state === 'play') launch(); else primary();
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state === 'play') pause(); else if (state === 'paused') play();
    }
  });
  window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys.delete(KEYMAP[e.key]); });
  window.addEventListener('blur', () => { keys.clear(); pause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  overlayBtn.addEventListener('click', () => primary());
  pauseBtn.addEventListener('click', () => { if (state === 'play') pause(); else if (state === 'paused') play(); });
  soundBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('rose-window-muted', muted ? '1' : '0'); } catch {}
    syncSound();
    tone(660, 0.08);
  });

  // --- boot ---
  function start(saved) {
    newGame();
    if (saved && saved.level) {
      score = saved.score || 0;
      lives = saved.lives || 3;
      level = saved.level;
      buildLevel();
      state = 'paused';
      pauseBtn.disabled = false;
      pauseBtn.textContent = 'Resume';
      show('Paused', `Picking up at window ${level}.`, 'Resume', play);
    } else {
      primary = play;
    }
    syncSound();
    new ResizeObserver(fit).observe(stage);
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    requestAnimationFrame(frame);
  }

  const hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(() => (state === 'play' || state === 'paused' ? { score, lives, level } : {}));
  } catch {}
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
